<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Биология білгірлері · 10-сынып</title>
<meta name="theme-color" content="#0f1b3d">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg1:#0e1a3f;--bg2:#1c2c63;--card:rgba(255,255,255,.09);--card2:rgba(255,255,255,.14);
  --ink:#f4f7ff;--mut:#b7c3e6;
  --g:#34d399;--t:#38bdf8;--o:#fbbf24;--p:#a78bfa;--r:#fb7185;
  --t1:#34d399;--t2:#38bdf8;--t3:#fbbf24;
  --ok:#22c55e;--bad:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Nunito","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 85% -10%,#3b2d8f55,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0e9f6e44,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;font-size:clamp(12px,min(1.2vw,2.12vh),26px);line-height:1.35;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit}
/* header: nav + single shared timer */
.nav{flex:none;z-index:45;display:flex;gap:.4em;align-items:center;padding:.4em .7em;background:rgba(10,18,48,.9);border-bottom:1px solid #ffffff22}
.brand{font-weight:900;font-size:1em;white-space:nowrap;display:flex;align-items:center;gap:.35em;margin-right:.3em}
.brand b{background:linear-gradient(90deg,var(--g),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
#navbtns{display:flex;gap:.35em;align-items:center;min-width:0}
.navbtn{padding:.3em .75em;border-radius:999px;background:var(--card);font-weight:800;font-size:.9em;border:2px solid transparent;white-space:nowrap}
.navbtn:hover{background:var(--card2)}
.navbtn.on{border-color:currentColor;background:#ffffff1c}
.navbtn[data-c="1"]{color:var(--g)}.navbtn[data-c="2"]{color:var(--t)}.navbtn[data-c="3"]{color:var(--o)}.navbtn[data-c="4"]{color:var(--p)}.navbtn[data-c="5"]{color:var(--r)}.navbtn[data-c="0"],.navbtn[data-c="f"]{color:#fff}
.tw{margin-left:auto;display:flex;align-items:center;gap:.45em;background:#0a1230cc;border:2px solid #ffffff33;border-radius:1em;padding:.15em .6em;flex:none}
.tw .tm{font-size:1.9em;font-weight:900;font-variant-numeric:tabular-nums;min-width:2.8ch;text-align:center;line-height:1.1}
.tw.low .tm{color:var(--r);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.tw .bt{background:#ffffff22;border-radius:.7em;padding:.2em .6em;font-weight:800}
.tw .bt:hover{background:#ffffff44}
.tchips{display:flex;gap:.25em}
.tchips button{background:#ffffff1a;border-radius:.7em;padding:.15em .5em;font-size:.8em;font-weight:800;border:2px solid transparent}
.tchips button.on{border-color:var(--o);color:var(--o)}
#wrap{flex:1;min-height:0;position:relative}
main{height:100%;padding:.6em .8em;display:flex;flex-direction:column;gap:.55em;overflow:hidden}
h1{font-size:3.6em;line-height:1.02;font-weight:900}
h2{font-size:1.2em;font-weight:900}
.hero{text-align:center;padding:.3em 0}
.hero .tag{display:inline-block;background:#ffffff1a;border:1px solid #ffffff33;padding:.2em 1em;border-radius:999px;font-weight:800;color:var(--mut);margin-bottom:.5em;font-size:.95em}
.hero h1 span{background:linear-gradient(90deg,#34d399,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:1.15em;color:var(--mut);margin-top:.4em}
.dna{font-size:1.6em;letter-spacing:.3em;margin-top:.2em;opacity:.8}
.teamsetup{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;margin:.2em auto;width:min(1100px,100%)}
.teamin{background:var(--card);border-radius:1em;padding:.6em .9em;border-top:.4em solid var(--c)}
.teamin label{display:block;font-weight:800;color:var(--c);margin-bottom:.25em;font-size:.9em}
.teamin input{width:100%;background:#0a1230aa;color:#fff;border:2px solid #ffffff33;border-radius:.7em;padding:.4em .7em;font-weight:900;font-size:1.2em;outline:none}
.teamin input:focus{border-color:var(--c)}
.teamin .ex{font-size:.7em;color:var(--mut);margin-top:.25em}
.btn{display:inline-flex;align-items:center;gap:.4em;padding:.5em 1.1em;border-radius:.9em;font-weight:900;background:linear-gradient(135deg,#10b981,#06b6d4);color:#04210f;box-shadow:0 6px 18px #0004;transition:.15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.big{font-size:1.4em;padding:.5em 1.8em}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none}
.btn.warn{background:linear-gradient(135deg,#fbbf24,#fb923c);color:#251300}
.btn.bad{background:linear-gradient(135deg,#fb7185,#ef4444);color:#fff}
.btn.sm{font-size:.8em;padding:.3em .7em;border-radius:.7em}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.center{text-align:center}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:.6em;width:min(1200px,100%);margin:.2em auto}
.flowc{background:var(--card);border-radius:1em;padding:.5em;text-align:center;border-bottom:.35em solid var(--c);cursor:pointer;transition:.15s}
.flowc:hover{transform:translateY(-3px);background:var(--card2)}
.flowc .n{font-size:2em;font-weight:900;color:var(--c);line-height:1}
.flowc .t{font-weight:900;font-size:.95em}
.flowc .s{font-size:.7em;color:var(--mut)}
.hint{color:var(--mut);font-size:.8em;text-align:center}
/* stage layout */
.banner{flex:none;display:flex;align-items:center;gap:.8em;background:linear-gradient(120deg,var(--c),#ffffff00 140%);border-radius:1em;padding:.3em .9em;color:#0a1228;box-shadow:0 6px 18px #0004}
.banner .num{font-size:2em;font-weight:900;line-height:1;background:#ffffff55;border-radius:.5em;padding:.05em .4em;color:#111}
.banner h2{font-size:1.6em;color:#0a1228;line-height:1.1}
.banner .meta{font-weight:800;color:#0a1228cc;font-size:.85em}
.banner .ar{margin-left:auto;display:flex;gap:.4em}
.banner .ar button{background:#0a122833;color:#0a1228;border-radius:.7em;padding:.15em .8em;font-weight:900;font-size:1.1em}
.banner .ar button:hover{background:#0a122855}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);gap:.7em}
.pane{display:flex;flex-direction:column;gap:.55em;min-height:0;min-width:0}
.card{background:var(--card);border-radius:1em;padding:.55em .9em;border:1px solid #ffffff1a;min-height:0;overflow:hidden}
.card.grow{flex:1}
.card h3{font-size:.9em;margin-bottom:.25em;color:var(--c,var(--o));font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.card ul{padding-left:1.1em}.card li{margin:.2em 0}
.rules{font-size:.86em;line-height:1.3}
.lbl{font-size:.85em;color:var(--mut);font-weight:800;flex:none}
/* question card grids */
.qgrid{flex:1;min-height:0;display:grid;gap:.5em;grid-auto-rows:1fr}
.qgrid.c6{grid-template-columns:repeat(6,1fr)}
.qgrid.c4{grid-template-columns:repeat(4,1fr)}
.qgrid.c3{grid-template-columns:repeat(3,1fr)}
.qcard{position:relative;border-radius:1em;background:linear-gradient(145deg,var(--c),#ffffff22 220%);color:#07172b;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s;box-shadow:0 6px 16px #0004;min-height:0;overflow:hidden;padding:.2em}
.qcard:hover{transform:scale(1.04)}
.qcard .qn{font-size:2.4em;line-height:1}
.qcard .qt{font-size:.7em;font-weight:800;opacity:.85;text-align:center;line-height:1.1}
.qcard .gr{position:absolute;top:.3em;right:.4em;font-size:.6em;background:#0a122833;border-radius:999px;padding:.05em .5em}
.qcard.done{filter:grayscale(.85) brightness(.55)}
.qcard.done::after{content:"✔";position:absolute;bottom:.15em;right:.5em;font-size:1.1em;color:#fff}
.qcard.tk .qn{font-size:1.8em}
.bbox{background:linear-gradient(160deg,#1a1a1a,#000);border:3px solid var(--c);border-radius:1.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s;box-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent);min-height:0}
.bbox:hover{transform:translateY(-3px) scale(1.02)}
.bbox .q{font-size:3.4em;line-height:1;color:var(--c);font-weight:900}
.bbox .o{font-weight:800;color:var(--mut)}
.bbox.done{opacity:.45}
/* modal (covers only the stage area; header timer + scoreboard stay usable) */
.modal{position:absolute;inset:0;z-index:40;background:rgba(5,10,30,.82);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:.6em}
.modal.on{display:flex}
.mbody{width:min(1200px,100%);max-height:100%;overflow:auto;background:linear-gradient(160deg,#16255a,#0e1a3f);border:3px solid var(--c,#fff);border-radius:1.2em;padding:.9em 1.4em;position:relative;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.mclose{position:absolute;top:.5em;right:.7em;font-size:1.3em;background:#ffffff22;border-radius:50%;width:2em;height:2em}
.mhead{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;margin-bottom:.4em;padding-right:2.6em}
.chip{display:inline-block;border-radius:999px;padding:.15em .8em;font-weight:900;background:var(--c,#fff);color:#07172b;font-size:.9em}
.chip.g{background:#ffffff22;color:#fff}
.qtext{font-size:2em;font-weight:800;line-height:1.22;margin:.4em 0 .6em}
.answer{background:linear-gradient(135deg,#16a34a,#059669);border-radius:.9em;padding:.55em .9em;font-size:1.6em;font-weight:800;margin:.4em 0;animation:pop .25s}
.hidden{display:none!important}
.actions{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.5em;align-items:center}
.clues{display:grid;gap:.45em;margin:.4em 0}
.clue{border-radius:.9em;padding:.45em .9em;background:#ffffff14;border:2px dashed #ffffff44;font-size:1.3em;font-weight:700;display:flex;align-items:center;gap:.7em}
.clue.on{background:#fbbf2426;border:2px solid var(--o);animation:pop .3s}
.clue .pts{background:var(--o);color:#111;border-radius:.7em;padding:.05em .6em;font-weight:900;flex:none;font-size:.85em}
.clue .ph{opacity:.55}
.mystery{font-size:3.6em;line-height:1.1;text-align:center;filter:drop-shadow(0 0 16px var(--o))}
.tf{font-size:1.9em;font-weight:800;line-height:1.25;margin:.5em 0}
.tfres{display:inline-block;font-weight:900;padding:.15em .9em;border-radius:.6em;font-size:1.6em;animation:pop .25s}
.tfres.y{background:#16a34a}.tfres.n{background:#dc2626}
.sol{background:#4c1d95cc;border-radius:.8em;padding:.5em .9em;margin-top:.4em;font-size:1.05em}
.sol b{color:#fde68a}
.tall{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;font-size:.82em;line-height:1.25}
.tall .tt{background:#ffffff12;border-left:.4em solid var(--p);border-radius:.7em;padding:.35em .6em}
.tall .tt b{color:var(--p)}
/* stage 1 */
.team1{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.3em;background:var(--card);border-radius:1em;border-left:.5em solid var(--c);padding:.4em .9em}
.team1 .nm{font-weight:900;font-size:1.25em;color:var(--c)}
.jury{display:grid;grid-template-columns:repeat(3,1fr) 1.1fr auto;gap:.5em;align-items:center}
.jury input{width:100%;background:#0a1230aa;border:2px solid #ffffff33;color:#fff;border-radius:.7em;padding:.35em .4em;text-align:center;font-weight:900;font-size:1.1em}
.jury .avg{font-weight:900;font-size:1.2em;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:.88em}
.tbl td,.tbl th{padding:.25em .5em;border-bottom:1px solid #ffffff22;text-align:left;vertical-align:top}
.note{color:var(--mut);font-size:.8em}
/* stage 5 */
.tabs{display:flex;gap:.4em;flex:none}
.tabs button{background:var(--card);border-radius:.8em;padding:.3em .9em;font-weight:900;border:2px solid transparent}
.tabs button.on{border-color:var(--r);color:var(--r);background:#ffffff1c}
.tabs button.fin::after{content:" ✔";color:var(--ok)}
.rnd{flex:1;min-height:0;display:flex;flex-direction:column;gap:.45em}
.stakerow{display:grid;grid-template-columns:1.3fr 1.6fr 1.3fr;gap:.6em;align-items:center;background:var(--card);border-radius:.9em;padding:.3em .9em;border-left:.5em solid var(--c)}
.stakerow .nm{font-weight:900;font-size:1.1em;color:var(--c);line-height:1.15}
.stakerow .sc{font-size:.7em;color:var(--mut);display:block;font-weight:600}
.stk{display:flex;gap:.4em;align-items:center}
.stk button{width:2.3em;height:2.3em;border-radius:50%;background:#ffffff1f;font-weight:900;font-size:1.1em;border:3px solid transparent}
.stk button:hover:not(:disabled){background:#ffffff44}
.stk button:disabled{opacity:.25}
.lock{font-size:1.6em;font-weight:900}
.res5{display:flex;gap:.4em;justify-content:flex-end}
.rtag{font-weight:900;padding:.1em .7em;border-radius:.6em}
.rtag.ok{background:#16a34a}.rtag.no{background:#dc2626}
.qbox{font-size:1.4em;font-weight:800;line-height:1.25}
.tie{display:grid;gap:.5em}
.tiei{background:var(--card);border-left:.5em solid var(--r);border-radius:.9em;padding:.5em .9em;font-size:1.15em}
/* scoreboard */
.sb{flex:none;z-index:30;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:.6em;padding:.45em .8em;background:linear-gradient(0deg,#070e2aee,#0b1535ee);border-top:1px solid #ffffff33}
.sbt{display:flex;align-items:center;gap:.6em;background:var(--card);border-radius:1em;padding:.25em .8em;border-bottom:.35em solid var(--c)}
.sbt .nm{flex:1;min-width:0}
.sbt .nm small{display:block;line-height:1}
.sbt .nm input{width:100%;background:transparent;border:0;color:var(--c);font-weight:900;font-size:1.05em;outline:none;border-bottom:2px dashed #ffffff22}
.sbt .nm input:focus{border-bottom-color:var(--c)}
.sbt .pts{font-size:3em;font-weight:900;line-height:1;min-width:1.8ch;text-align:center;font-variant-numeric:tabular-nums}
.sbt .pts.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.3);color:var(--c)}}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:.2em}
.pm button{background:#ffffff22;border-radius:.6em;font-weight:900;min-width:2.3em;padding:.1em .3em;font-size:.85em}
.pm button:hover{background:var(--c);color:#0a1228}
.sbx{display:flex;flex-direction:column;gap:.25em;justify-content:center}
.sbx button{background:#ffffff1f;border-radius:.7em;padding:.2em .7em;font-weight:800;font-size:.75em;white-space:nowrap}
.sbx button:hover{background:#ffffff44}
.toast{position:fixed;left:50%;bottom:7.5em;transform:translateX(-50%);background:#fff;color:#111;font-weight:900;padding:.4em 1.1em;border-radius:999px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* final */
.podium{flex:none;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:.8em;align-items:end;width:min(900px,100%);margin:.2em auto 0}
.pod{border-radius:1.2em 1.2em 0 0;text-align:center;padding:.4em .5em;background:linear-gradient(180deg,var(--c),#ffffff11 180%);color:#0a1228;font-weight:900;display:flex;flex-direction:column;justify-content:center}
.pod .md{font-size:2.4em;line-height:1}
.pod .nm{font-size:1.3em;line-height:1.1}
.pod .sc{font-size:2.6em;line-height:1}
.pod.p1{height:19vh}.pod.p2{height:15.5vh}.pod.p3{height:13vh}
.nom{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.nomi{display:flex;gap:.5em;align-items:center;background:var(--card);border-radius:.8em;padding:.25em .7em;font-size:.88em}
.nomi b{flex:none;color:var(--o)}
.nomi input{flex:1;min-width:0;background:#0a1230aa;border:2px solid #ffffff22;border-radius:.6em;padding:.15em .5em;color:#fff;font-weight:800}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.proverb{font-size:1.15em;font-style:italic;text-align:center;color:var(--o);font-weight:800}
@media (max-width:1320px){.brand b{display:none}}
</style>
</head>
<body>
<div class="nav" id="nav"><div class="brand">🧬 <b>Биология білгірлері</b></div><div id="navbtns"></div>
 <div class="tw" id="tw" title="Бір ортақ таймер (Бос орын — бастау/тоқтату)"><span style="font-size:.85em">⏱</span><span class="tm" id="twtm">00:00</span><button class="bt" id="twgo">▶</button><button class="bt" id="twrs">↺</button><div class="tchips" id="tchips"></div></div></div>
<div id="wrap"><main id="main"></main>
<div class="modal" id="modal"><div class="mbody" id="mbody"></div></div></div>
<div class="sb" id="sb"></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script>
"use strict";
/* ============ DATA ============ */
const TC=["var(--t1)","var(--t2)","var(--t3)"];
const STAGES=[
 {n:1,nav:"Визитка",key:"s1",c:"var(--g)",hex:"#34d399",title:"Биолог визиткасы",short:"Сәлемдесу",meta:"8 минут · ең көбі 10 ұпай"},
 {n:2,nav:"Жылдам жауап",key:"s2",c:"var(--t)",hex:"#38bdf8",title:"Жылдам жауап",short:"15 блиц-сұрақ",meta:"10 минут · әр команда 5 сұрақ · ең көбі 5 ұпай + бонус"},
 {n:3,nav:"Қара жәшік",key:"s3",c:"var(--o)",hex:"#fbbf24",title:"Қара жәшік",short:"3 меңзеу",meta:"10 минут · ең көбі 6 ұпай"},
 {n:4,nav:"Есепші",key:"s4",c:"var(--p)",hex:"#a78bfa",title:"Биолог-есепші",short:"7 есеп",meta:"12 минут · ең көбі 7 ұпай + 1 жылдамдық бонусы"},
 {n:5,nav:"Капитандар",key:"s5",c:"var(--r)",hex:"#fb7185",title:"Капитандар сайысы «Тәуекел!»",short:"Ставкамен ойын",meta:"8 минут · ұпай ставкаға байланысты"}
];
const S1={
 rules:["Әр команда **1,5 минут** ішінде өзін таныстырады: команданың атауы, ұраны (девизі), эмблемасы, құрамы.","Таныстыру кемінде **3 биологиялық термин** қамтуы керек (мысалы, команда атауының биологиялық мағынасы, ұранда «ДНҚ», «жасуша», «фермент» сөздері). Формасы еркін: тақпақ, шағын көрініс, ән, ребус.","Дайындық алдын ала жасалады (сайыс күнінен 3–5 күн бұрын).","Қазылардың әрқайсысы 0–10 ұпай қояды, **орташа мәні** (0,5-ке дейін дөңгелектеп) команданың ұпайы болады."],
 crit:[["Биологиялық мазмұн","Кемінде 3 термин, дұрыс және орынды","0–3"],["Шығармашылық","Идея, эмблема, көрнекілік, бейнелілік","0–4"],["Ұйымшылдық және сөйлеу мәдениеті","Барлық мүше қатысты, тілі таза, уақыт сақталды","0–3"]],

let audioCtx;
function beep(n=3){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);
  const t=audioCtx.currentTime+i*.3;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}}catch(e){}}
function mmss(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
const TW={total:0,left:0,iv:null,end:0};
const PRESETS={intro:[30,60],s1:[90],s2:[15,10],s3:[10],s4:[600,120],s5:[30],final:[30,60]};
function twDraw(){$("#twtm").textContent=mmss(TW.left);$("#tw").classList.toggle("low",TW.left<=5&&TW.left>0&&!!TW.iv);
  $("#twgo").textContent=TW.iv?"⏸":"▶";
  document.querySelectorAll("#tchips button").forEach(b=>b.classList.toggle("on",+b.dataset.s===TW.total))}
function twStop(){clearInterval(TW.iv);TW.iv=null;$("#tw").classList.remove("low");twDraw()}
function twSet(secs){twStop();TW.total=TW.left=secs;twDraw()}
function twToggle(){
  if(TW.iv){twStop();return}
  if(TW.left<=0)TW.left=TW.total;
  TW.end=Date.now()+TW.left*1000;
  TW.iv=setInterval(()=>{TW.left=(TW.end-Date.now())/1000;
    if(TW.left<=0){TW.left=0;twStop();$("#tw").classList.add("low");beep();return}twDraw()},100);
  twDraw();
}
function twPresets(view){
  const list=PRESETS[view]||[30];
  $("#tchips").innerHTML=list.map(s=>`<button data-s="${s}">${s>=60?mmss(s):s+"с"}</button>`).join("");
  twSet(list[0]);
}

  m.innerHTML=banner(s)+`<div class="split"><div class="pane">${rulesCard(s,S5.rules)}</div>
   <div class="pane" id="s5live"><div class="tabs">${[1,2,3,4].map(n=>`<button data-tab="${n}" class="${s5cur===n?"on":""} ${s5fin(n)?"fin":""}">Раунд ${n}</button>`).join("")}<button data-tab="5" class="${s5cur===5?"on":""}">⚖️ Тай-брейк</button></div>
   ${s5cur===5?tieHTML():roundHTML(s5cur)}</div></div>`;
  bindS5(m);
}
function maxStake(t){return Math.max(1,Math.min(3,Math.floor(st.scores[t])))}
function tieHTML(){return `<div class="lbl">Тең ұпай болғанда — тай-брейк сұрақтары</div><div class="tie">${S5.tie.map((t,i)=>`<div class="tiei"><b style="color:var(--r)">Т${i+1}.</b> ${esc(t[0])}<div style="margin-top:.3em"><button class="btn sm warn" data-tie="${i}">👁 Жауабы</button></div><div class="answer hidden" id="tie${i}" style="font-size:1.1em">✔ ${esc(t[1])}</div></div>`).join("")}</div>`}
function roundHTML(n){const r=r5(n),q=S5.q[n-1],allSet=r.stakes.every(x=>x>0);
  return `<div class="rnd" data-r="${n}"><div class="lbl">Раунд ${n} · [${q[0]}-сынып тақырыбы]</div>
   ${[0,1,2].map(t=>`<div class="stakerow" style="--c:${TC[t]}"><div class="nm">${esc(tname(t))}<span class="sc">ұпайы: ${fmt(st.scores[t])} · макс. ставка ${maxStake(t)}</span></div>
     <div>${r.open?`<div class="lock">${r.stakes[t]>0?"🔓 "+r.stakes[t]:"—"}</div>`:`<div class="stk" data-t="${t}">${[1,2,3].map(v=>`<button data-v="${v}" ${v>maxStake(t)?"disabled":""}>${v}</button>`).join("")}<span class="note">${r.stakes[t]>0?"🔒 ставка жасалды":"құпия ставка"}</span></div>`}</div>
     <div class="res5">${r.open&&r.q?(r.res[t]==null?`<button class="btn sm" data-ok="${t}" style="background:#22c55e">✔ +${r.stakes[t]}</button><button class="btn sm bad" data-no="${t}">✘ −${r.stakes[t]}</button>`:`<span class="rtag ${r.res[t]>=0?"ok":"no"}">${r.res[t]>=0?"+":"−"}${Math.abs(r.res[t])}</span>`):""}</div></div>`).join("")}
   <div class="actions" style="margin-top:0"><button class="btn warn sm" data-open="${n}" ${r.open||!allSet?"disabled":""}>🔓 Ставкаларды ашу</button>
   <button class="btn sm" data-showq="${n}" ${!r.open||r.q?"disabled":""}>❓ Сұрақты көрсету (30 с)</button>${r.q?`<button class="btn warn sm" data-ans="${n}">👁 Жауабы</button>`:""}</div>
   ${r.q?`<div class="qbox">${esc(q[1])}</div><div class="answer ${r.ans?"":"hidden"}" id="a5_${n}" style="font-size:1.15em;margin:0">✔ ${esc(q[2])}</div>`:""}</div>`}
function bindS5(m){
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{s5cur=+b.dataset.tab;rerender5()});
  m.querySelectorAll("[data-r]").forEach(card=>{const n=+card.dataset.r,r=r5(n);
    card.querySelectorAll(".stk").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{r.stakes[+g.dataset.t]=+b.dataset.v;save();rerender5()}));
    const q=s=>card.querySelector(s);
    const op=q("[data-open]");if(op)op.onclick=()=>{r.open=true;save();rerender5();toast("Ставкалар ашылды!")};
    const sq=q("[data-showq]");if(sq)sq.onclick=()=>{r.q=true;save();rerender5();twSet(30)};
    const an=q("[data-ans]");if(an)an.onclick=()=>{r.ans=true;save();$("#a5_"+n).classList.remove("hidden")};
    card.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const t=+b.dataset.ok;r.res[t]=addScore(t,r.stakes[t],"тәуекел ✔");save();rerender5()});
    card.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{const t=+b.dataset.no;r.res[t]=addScore(t,-r.stakes[t],"тәуекел ✘");save();rerender5()});
  });
  m.querySelectorAll("[data-tie]").forEach(b=>b.onclick=()=>$("#tie"+b.dataset.tie).classList.toggle("hidden"));
}
function rerender5(){if(st.view!=="s5")return;vS5($("#main"))}
function vFinal(m){
  const order=[0,1,2].sort((a,b)=>st.scores[b]-st.scores[a]);
  const tie=st.scores[order[0]]===st.scores[order[1]];
  const medal=["🥇","🥈","🥉"];
  const pod=[order[1],order[0],order[2]], cls=["p2","p1","p3"], rk=[1,0,2];
  m.innerHTML=`<div class="hero" style="padding:0"><div class="tag">Сайыстың қорытындысы</div><h1 style="font-size:3em">${tie?"ТЕҢ ҰПАЙ!":"ЖЕҢІМПАЗ"}</h1>
   <p class="sub" style="margin-top:.2em">${tie?`«${esc(tname(order[0]))}» және «${esc(tname(order[1]))}» — ${fmt(st.scores[order[0]])} ұпайдан. Тай-брейк сұрақтары — 5-кезеңде.`:`«Биология білгірлері» атағын жеңіп алған команда — <b style="color:${TC[order[0]]}">${esc(tname(order[0]))}</b>!`}</p></div>
   <div class="podium">${pod.map((t,k)=>`<div class="pod ${cls[k]}" style="--c:${TC[t]}"><div class="md">${medal[rk[k]]}</div><div class="nm">${esc(tname(t))}</div><div class="sc">${fmt(st.scores[t])}</div></div>`).join("")}</div>
   <div class="center"><button class="btn warn" id="conf">🎉 Салют!</button> ${tie?`<button class="btn ghost" data-go="s5">⚖️ Тай-брейк</button>`:""} <button class="btn ghost" data-go="intro">🏠 Басты</button></div>
   <div class="lbl">🏅 Номинациялар</div><div class="nom">${NOMS.map((n,i)=>`<div class="nomi"><b>${esc(n)}:</b><input data-nom="${i}" value="${esc(st.noms[i]||"")}" placeholder="команда / оқушы"></div>`).join("")}</div>
   <div class="proverb">«Білекті бірді жығады, білімді мыңды жығады»</div>`;
  m.querySelectorAll("[data-nom]").forEach(i=>i.addEventListener("input",()=>{st.noms[i.dataset.nom]=i.value;save()}));
  $("#conf").onclick=()=>confettiBurst(260);
  if(!tie&&st.scores[order[0]]>0)setTimeout(()=>confettiBurst(260),350);
}

/* ============ MODAL ============ */
let onClose=null;
function openModal(html,color,cb){const m=$("#modal");$("#mbody").innerHTML=`<button class="mclose" id="mx" aria-label="Жабу">✕</button>`+html;$("#mbody").style.setProperty("--c",color||"#fff");
  m.classList.add("on");onClose=cb;$("#mx").onclick=()=>closeModal(true)}
function closeModal(mark){const m=$("#modal");if(!m.classList.contains("on"))return;m.classList.remove("on");
  if(mark&&onClose)onClose();onClose=null;}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal(true)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal(true);
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;
  if(e.code==="Space"){e.preventDefault();twToggle();return}
  if($("#modal").classList.contains("on"))return;
  const i=VIEWS.indexOf(st.view);
  if(e.key==="ArrowRight"&&i<VIEWS.length-1)go(VIEWS[i+1]);
  if(e.key==="ArrowLeft"&&i>0)go(VIEWS[i-1]);
});
document.addEventListener("keyup",e=>{if(e.code==="Space"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))e.preventDefault()});

/* ============ CONFETTI ============ */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",sizeCv);sizeCv();
function confettiBurst(n){
  const cols=["#34d399","#38bdf8","#fbbf24","#a78bfa","#fb7185","#ffffff"];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.3,vx:(Math.random()-.5)*5,vy:2+Math.random()*5,r:5+Math.random()*8,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:0});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.a+=p.va;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+30&&p.life<600);
  raf=parts.length?requestAnimationFrame(tick):null;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* ============ INIT ============ */
if(/[?&]shot/.test(location.search)){const z=document.createElement('style');z.textContent='*{animation:none!important;transition:none!important}';document.head.appendChild(z)}
window.addEventListener("error",e=>{(window.__errs=window.__errs||[]).push(e.message)});
renderSB();
const h=(location.hash||"").slice(1).split("/");
go(VIEWS.includes(h[0])?h[0]:(st.view||"intro"));
// demo hooks for screenshots: #s2/q:3  #s3/b:1:2  #s4/t:2  #s4/all  #s4/f:1  #s5/r:2
if(h[1]&&h[1].startsWith("q:"))setTimeout(()=>{openQ2("q"+h[1].slice(2));$("#rev").click()},50);
if(h[1]&&h[1].startsWith("b:")){const p=h[1].split(":");setTimeout(()=>{openB(+p[1]);for(let k=0;k<+(p[2]||0);k++)$("#nextclue").click()},50)}
if(h[1]&&h[1].startsWith("t:"))setTimeout(()=>{openTask(+h[1].slice(2));$("#rev").click()},50);
if(h[1]==="all")setTimeout(openAllTasks,50);
if(h[1]&&h[1].startsWith("f:"))setTimeout(()=>{openTF(+h[1].slice(2));$("#rev").click()},50);
if(h[1]&&h[1].startsWith("r:"))setTimeout(()=>{s5cur=+h[1].slice(2);rerender5()},50);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
